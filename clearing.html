/* ═══════════════════════════════════════════════════════════════════════
   🔴 [V31 · ل-٤] هذه كانت نسخة ej **السابقة للإصلاح** — لا تُهرّب &.
   ───────────────────────────────────────────────────────────────────────

function ej(s){ return String(s??'').replace(/&/g,'&amp;').replace(/\\/g,'\\\\')
                                    .replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function toast(m,t="s"){

/* مطابقة حرفية لـnormalizePhone في Code.gs و index.js — أي انحراف يُنتج
   مفتاحاً منشقّاً لا يراه المدير ولا يمسّه التصفير. */
function nP(raw){
  if(!raw)return"";
  let p=String(raw).trim();
  const ar=['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  for(let i=0;i<10;i++)p=p.split(ar[i]).join(String(i));
  let c=p.replace(/\D/g,"");
  if(c.indexOf("964")===0)c=c.substring(3);
  return c.replace(/^0+/,"");
}

  const n=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Baghdad"}));

  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
const AR_MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو",
                 "يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function monthLabel(k){
  const p=String(k).split("-");
  return (AR_MONTHS[Number(p[1])-1]||k)+" "+p[0];
}

/* ═══════════════════════════════════════════════════════════════════════════
   💰 [V31 · م-٢/م-٦] كتلة المال المشتركة — منقولة **حرفياً** من
   server/index.js (toLatinDigits:5202 · parseAmount:5281 · cleanNumber:5318 ·
   parseCommissionRule:5328). لا تُعدَّل هنا وحدها أبداً: أي تغيير يُنقل إلى
   الخمسة معاً (index.js · Code.gs · Nhleman.html · Restaurant.html · clearing.html).
   ───────────────────────────────────────────────────────────────────────────
   لماذا نُقلت؟ كان في النظام **خمسة مُحلّلات** لنفس القاعدة، اثنان منها
   متطابقان على السيرفر وثلاثة مختلفة في اللوحات:

     • Restaurant.html كان يعالج "/" وحدها ⇒ قاعدة "1000-500" تُقرأ
       parseFloat("1000-500") = 1000، فالمطعم يرى دَيناً **ضِعف** ما يحاسبه
       السيرفر (500). وفارقٌ في الفاتورة لا يُكتشف إلا بمراجعةٍ يدوية.
     • pComm في لوحة الإدارة: لا "-" ولا "\"، وparseFloat على المال ⇒
       "1.000" تُقرأ 1، و"١٠٠٠/٥٠٠" تُقرأ صفراً.
     • مبلغ الاشتراك كان يُستخرج بـ match(/\d+/) ⇒ "شهري 50.000" = **50**،
       و"٥٠٠٠٠" = **0**. خطأٌ بألف ضعف في فاتورةٍ شهرية.

   العملة العراقية بلا كسور عملياً: كل فاصل تتبعه ٣ خانات = آلاف،
   و"15.5" غامضٌ ⇒ يُرفض صراحةً بدل أن يُخمَّن.
   ═══════════════════════════════════════════════════════════════════════════ */
function toLatinDigits(s){
  return String(s===null||s===undefined?"":s)
    .replace(/[٠-٩]/g,function(d){return String.fromCharCode(d.charCodeAt(0)-0x0660+48);})
    .replace(/[۰-۹]/g,function(d){return String.fromCharCode(d.charCodeAt(0)-0x06F0+48);});
}
function parseAmount(raw,opts){
  opts=opts||{};
  const s0=toLatinDigits(raw).trim();
  if(s0==="")return{ok:false,value:null,reason:"empty"};
  let s=s0.replace(/[\s ٬]/g,"").replace(/د\.?ع|IQD|iqd|دينار/g,"");
  let neg=false;
  if(/^-/.test(s)){neg=true;s=s.slice(1);}
  else if(/-$/.test(s)){neg=true;s=s.slice(0,-1);}
  if(s==="")return{ok:false,value:null,reason:"no_digits"};
  if(/[^0-9.,]/.test(s))return{ok:false,value:null,reason:"bad_chars",got:s0};
  const seps=s.match(/[.,]/g)||[];
  if(seps.length>0){
    const parts=s.split(/[.,]/),tail=parts.slice(1);
    if(tail.every(function(p){return p.length===3;})&&parts[0].length>=1)s=parts.join("");
    else if(seps.length===1&&tail[0].length>0&&tail[0].length<3)
      return{ok:false,value:null,reason:"ambiguous_decimal",got:s0};
    else return{ok:false,value:null,reason:"bad_separators",got:s0};
  }
  if(!/^\d+$/.test(s))return{ok:false,value:null,reason:"not_integer",got:s0};
  const n=Number(s);
  if(!isFinite(n))return{ok:false,value:null,reason:"overflow",got:s0};
  if(neg&&opts.allowNegative!==true)return{ok:false,value:null,reason:"negative_not_allowed",got:s0};
  return{ok:true,value:neg?-n:n,reason:null};
}
/* لا noteReject هنا — لا سجلّ سيرفري في اللوحة. والسلوك الرقمي مطابق. */
function cleanNumber(val){
  const r=parseAmount(val,{allowNegative:true});
  return r.ok?r.value:0;
}
function parseCommissionRule(commStr,payTypeStr){
  const str=String(commStr).toLowerCase().trim();
  const pType=String(payTypeStr||"").trim();
  let baseDrv=0,baseRes=0,isMonthly=false;
  if(str.indexOf("شهري")>-1||str==="monthly"){
    isMonthly=true;
  }else if(str.indexOf("/")>-1||str.indexOf("-")>-1||str.indexOf("\\")>-1){
    const parts=str.split(/[\/\-\\]/).map(function(x){return String(x).trim();}).filter(function(x){return x!=="";});
    if(parts.length!==2){
      /* صيغةٌ معطوبة ("1000-" أو "-1000"): تُعامَل رقماً مفرداً بقيمةٍ مطلقة —
         وإلا انقلب الدوران أو صار الدَين رصيداً صامتاً لصالح المطعم. */
      const single=Math.abs(cleanNumber(parts[0]||"0"));
      if(pType.indexOf("مناصفة")>-1)return{drv:single/2,res:single/2,isMonthly:false,malformed:true};
      return{drv:0,res:single,isMonthly:false,malformed:true};
    }
    return{drv:cleanNumber(parts[0]),res:cleanNumber(parts[1]),isMonthly:false};
  }else{
    const val=cleanNumber(str);
    if(pType.indexOf("مناصفة")>-1){baseDrv=val/2;baseRes=val/2;}
    else{baseDrv=0;baseRes=val;}
  }
  return{drv:baseDrv,res:baseRes,isMonthly:isMonthly};
}
/* 💳 [V31 · م-٢] مبلغ الاشتراك الشهري — الكلمات تُسقَط ثم يُقرأ الباقي
   بقارئ المبالغ نفسه. كان match(/\d+/): لاتينيٌّ فقط ولا يفهم فاصل الآلاف. */
function monthlySubAmount(commRaw){
  const s=String(commRaw==null?"":commRaw);
  if(s.indexOf("شهري")===-1&&s.toLowerCase().indexOf("monthly")===-1)return null;
  return cleanNumber(s.replace(/اشتراك|شهري|monthly/gi,""));
}

/* قيمة الاشتراك من قاعدة المطعم — **بنفس منطق monthlyArchiver حرفياً**.
   🔧 [V31 · م-٢] كان الاثنان يستعملان match(/\d+/): لاتينيٌّ فقط ولا يفهم
   فاصل الآلاف ⇒ «شهري 50.000» تُحصَّل **50 ديناراً**، و«٥٠٠٠٠» **صفراً**.
   نُقل الموضعان معاً إلى monthlySubAmount — والتطابق بينهما شرطُ صحّة
   ورقة التحصيل مقابل البريد الشهري. */
function subAmount(commRaw){ return monthlySubAmount(commRaw); }

/* ════════════════════ المصادقة ════════════════════ */
async function consumeToken(tok){
  if(!tok)return false;
  try{ await auth.signInWithCustomToken(tok); }catch(e){ return false; }
  /* التوكن المخصّص يصلح ساعة. نجدّده قبل انقضائها بعشر دقائق كي لا تسقط
     المستمعات في منتصف عمل الليدر. */
  if(_tokTimer)clearTimeout(_tokTimer);
  _tokTimer=setTimeout(refreshToken,50*60*1000);
  return true;
}
async function refreshToken(){
  try{
    const s=JSON.parse(sessionStorage.getItem(SS_SESSION)||"{}");
    if(!s.p||!s.phone)return;
    const pass=decodeURIComponent(escape(atob(s.p)));
    const d=await apiGet({action:"STAFF_LOGIN",phone:s.phone,password:pass});
    if(d&&d.success){
      if(d.token){STOKEN=d.token;s.token=d.token;sessionStorage.setItem(SS_SESSION,JSON.stringify(s));}
      await consumeToken(d.firebase_token);
    }
  }catch(e){}
}

window.doLogin=async function(){
  const phone=document.getElementById("sPhone").value.trim();
  const pass=document.getElementById("sPass").value.trim();
  if(!phone||!pass)return toast("أدخل الهاتف وكلمة المرور","e");
  const btn=document.getElementById("loginBtn");btn.disabled=true;btn.textContent="جارٍ الدخول…";
  try{
    const d=await apiGet({action:"STAFF_LOGIN",phone,password:pass});
    if(!d.success){toast(d.msg||"تعذّر الدخول","e");return;}
    STOKEN=d.token;EMP_NAME=d.name;EMP_PHONE=d.phone;
    sessionStorage.setItem(SS_SESSION,JSON.stringify({
      token:STOKEN,name:EMP_NAME,phone:EMP_PHONE,
      p:btoa(unescape(encodeURIComponent(pass)))
    }));
    const ok=await consumeToken(d.firebase_token);
    if(!ok){toast("تعذّرت المصادقة السحابية — أعد المحاولة","e");return;}
    enterApp();
  } finally { btn.disabled=false;btn.textContent="دخول"; }
};

window.logout=function(){
  sessionStorage.removeItem(SS_SESSION);
  sessionStorage.removeItem(SS_BATCH);
  sessionStorage.removeItem(SS_SBATCH);
  try{auth.signOut();}catch(e){}
  location.reload();
};

window.addEventListener("DOMContentLoaded",async ()=>{
  const saved=sessionStorage.getItem(SS_SESSION);
  if(!saved)return;
  try{
    const s=JSON.parse(saved);
    STOKEN=s.token;EMP_NAME=s.name;EMP_PHONE=s.phone;
    if(!s.p)return;
    const pass=decodeURIComponent(escape(atob(s.p)));
    const d=await apiGet({action:"STAFF_LOGIN",phone:EMP_PHONE,password:pass});
    if(d&&d.success&&await consumeToken(d.firebase_token)) enterApp();
  }catch(e){}
});

/* ════════════════════ الإقلاع ════════════════════ */
function enterApp(){
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="flex";
  document.getElementById("hName").textContent=EMP_NAME||"ليدر";
  MONTH=monthKey(0);
  loadAll();
  /* السجلّان مستمعان حيّان — عقدتان صغيرتان، وتحديثهما اللحظي هو ما يحوّل
     الزرّ إلى «قيد المراجعة» بلا إعادة تحميل. */
  db.ref("clearing_requests").on("value",
    s=>{ REQS=s.val()||{}; if(_ready) render(); },
    e=>{ toast("تعذّرت قراءة طلبات التصفير — راجع القواعد","e"); }
  );
  db.ref("sub_collections").on("value",
    s=>{ SUBS=s.val()||{}; if(_ready) render(); },
    e=>{ toast("تعذّرت قراءة سجلّ الاشتراكات — راجع القواعد","e"); }
  );
}

/* الدفاتر والقواعد بقراءة واحدة لا بمستمع دائم: عقدة الدفاتر تتغيّر مع كل
   طلب يُؤرشَف، ومستمعٌ عليها يعني تنزيلاً متكرّراً بلا فائدة للّيدر — وهو
   يعمل بلقطةٍ واحدة ثم يرفع طلباته. زرّ «تحديث» يعيد القراءة. */
async function loadAll(){
  document.getElementById("hSub").textContent="جارٍ التحميل…";
  try{
    const [led,cfg,rst]=await Promise.all([
      db.ref("ledgers/restaurants").once("value"),
      db.ref("restaurants_config").once("value"),
      db.ref("ledgers/reset_events/RESTAURANT").once("value")
    ]);
    LEDGERS=led.val()||{}; RESETS=rst.val()||{}; CFG=cfg.val()||{};
    _ready=true;
    restoreOrBuild();
    render();
    document.getElementById("hSub").textContent="آخر تحديث "+
      new Date().toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"});
  }catch(e){
    document.getElementById("hSub").textContent="تعذّر التحميل";
    /* الرسالة تسمّي العلاج لا العطب وحده: أشيع سبب هنا هو غياب قاعدة القراءة
       الجذرية على restaurants_config — وهي سطرٌ واحد في database.rules.json. */
    toast("تعذّرت قراءة الدفاتر. تأكّد من نشر قواعد فايربيس V4.0.","e");
  }
}
window.reload=function(){ loadAll(); };

/* ════════════════════ قسم الديون ════════════════════ */

/* هل للمطعم طلب تصفير **قائم**؟
   ─────────────────────────────────────────────────────────────────────
   الطلب يصير لاغياً بمجرّد أن يُصفّر المدير الدين، لأن resetDebtForEntity
   تختم ledgers/reset_events/RESTAURANT/{الهاتف}. فنقارن الختمين: طلبٌ أقدم
   من آخر تصفير هو طلبٌ استُهلك، والمطعم يعود إلى الطابور حين يتراكم عليه
   دينٌ جديد. ⇒ لا يحتاج أحدٌ إلى حذف شيء يدوياً. */
function reqActive(phone){
  const r=REQS[phone];
  if(!r)return false;
  const reqAt=r.ts?new Date(r.ts).getTime():0;
  const rstAt=RESETS[phone]?new Date(RESETS[phone]).getTime():0;
  return reqAt>rstAt;
}

function debtPool(){
  return Object.keys(LEDGERS)
    .map(p=>({
      phone:p,
      debt:Number((LEDGERS[p]||{}).debt)||0,
      orders:Number((LEDGERS[p]||{}).completed_orders)||0
    }))
    .filter(x=>x.debt>0 && !reqActive(x.phone))
    .sort((a,b)=>b.debt-a.debt);
}

/* ════════════════════ قسم الاشتراكات ════════════════════ */

/* الطابور: كل مطعم قاعدته شهرية ولم يُسجَّل استلامه لهذا الشهر.
   ⚠️ ولا فلترة بالنشاط: restaurants_config لا تحمل حقل status إطلاقاً
      (mirrorRestaurantConfig تكتب comm · payType · name · lat/lng · area).
      والنشاط الشهري يعيش في Daily_Reports داخل الشيت، ولا تصله هذه الصفحة.
      ⇒ نعرض الجميع، ونُظهر عدد الطلبات ليميّز الليدر العامل من المتوقّف. */
function subPool(){
  const done=SUBS[MONTH]||{};
  return Object.keys(CFG)
    .map(p=>({ phone:p, amount:subAmount((CFG[p]||{}).comm),
               name:(CFG[p]||{}).name||"",
               orders:Number((LEDGERS[p]||{}).completed_orders)||0 }))
    .filter(x=>x.amount!==null && !done[x.phone])
    .sort((a,b)=>b.amount-a.amount || b.orders-a.orders);
}

/* ════════════════════ تجميد الدفعة ════════════════════ */
/* الدفعة مجمّدة عمداً: لو أُعيد بناؤها عند كل تحديث لانزلق الصفّ تحت إصبع
   الليدر كلّما تغيّر دَينُ مطعم، فيرفع طلباً لغير من قصد. */
function restoreOrBuild(){
  try{
    const a=JSON.parse(sessionStorage.getItem(SS_BATCH)||"null");
    if(a&&Array.isArray(a.phones)&&a.phones.length){BATCH=a.phones;BATCH_NO=a.no||1;}
    else newDebtBatch(1);
  }catch(e){ newDebtBatch(1); }
  try{
    const b=JSON.parse(sessionStorage.getItem(SS_SBATCH)||"null");
    if(b&&b.month===MONTH&&Array.isArray(b.phones)&&b.phones.length){SBATCH=b.phones;SBATCH_NO=b.no||1;}
    else newSubBatch(1);
  }catch(e){ newSubBatch(1); }
}
function newDebtBatch(no){
  BATCH=debtPool().slice(0,BATCH_SIZE).map(x=>x.phone);
  BATCH_NO=no||(BATCH_NO+1);
  try{sessionStorage.setItem(SS_BATCH,JSON.stringify({phones:BATCH,no:BATCH_NO}));}catch(e){}
}
function newSubBatch(no){
  SBATCH=subPool().slice(0,BATCH_SIZE).map(x=>x.phone);
  SBATCH_NO=no||(SBATCH_NO+1);
  try{sessionStorage.setItem(SS_SBATCH,JSON.stringify({phones:SBATCH,no:SBATCH_NO,month:MONTH}));}catch(e){}
}
window.nextBatch=function(){
  if(TAB==="debt"){ newDebtBatch(); toast("الدفعة "+BATCH_NO+" جاهزة"); }
  else { newSubBatch(); toast("الدفعة "+SBATCH_NO+" جاهزة"); }
  render();
};
window.setMonth=function(off){
  MONTH_OFF=off; MONTH=monthKey(off);
  newSubBatch(1);
  render();
};

/* ════════════════════ العرض ════════════════════ */
function render(){ TAB==="debt" ? renderDebt() : renderSub(); updCounters(); }

function updCounters(){
  document.getElementById("cDebt").textContent=num(debtPool().length);
  document.getElementById("cSub").textContent=num(subPool().length);
}

function renderDebt(){
  const panel=document.getElementById("panel"), list=document.getElementById("list"),
        foot=document.getElementById("foot");

  const rows=BATCH.map(p=>({
    phone:p,
    name:(CFG[p]||{}).name||"(مطعم بلا اسم في المرآة)",
    monthly:subAmount((CFG[p]||{}).comm)!==null,
    debt:Number((LEDGERS[p]||{}).debt)||0,
    orders:Number((LEDGERS[p]||{}).completed_orders)||0,
    req:reqActive(p)?REQS[p]:null
  }));

  if(!rows.length){
    panel.innerHTML="";
    list.innerHTML='<div class="empty"><b>لا مطعم عليه دين</b>'+
      '<p>كل الدفاتر مصفّرة. اضغط «تحديث» بعد أن تُؤرشَف طلبات اليوم.</p></div>';
    foot.textContent="";
    return;
  }

  const done=rows.filter(r=>r.req).length, total=rows.length;

  panel.innerHTML=
    '<div class="pcard debt"><div class="top">'+
      '<div><div class="bn">الدفعة '+BATCH_NO+' · الديون</div>'+
      '<div class="cnt">'+done+' <small>من '+total+'</small></div></div>'+
      '<div class="bn">'+num(rows.reduce((s,r)=>s+r.debt,0))+' د.ع</div>'+
    '</div>'+
    '<div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>'+
    '<div class="sub-t">مرتّبة بالدين الأعلى. ارفع طلباً لكل مطعم استلمتَ منه المبلغ — '+
    'والمدير هو من يُصفّر الدفتر بعد قبوله.</div></div>'+
    (done===total
      ? '<div class="done"><b>اكتملت الدفعة '+BATCH_NO+'</b>'+
        '<p>رُفعت '+total+' طلبات إلى المدير. تظهر الآن عشرون مطعماً جديداً.</p>'+
        '<button onclick="nextBatch()">الدفعة التالية</button></div>'
      : '');

  list.innerHTML=rows.map((r,i)=>{
    let right;
    if(!r.req) right='<button class="rq" onclick="askDebt(\''+ej(r.phone)+'\')">طلب تصفير</button>';
    else if(r.req.status==="approved") right='<div class="badge a">مقبول ✓</div>';
    else if(r.req.status==="rejected") right='<div class="badge r">مرفوض</div>';
    else right='<div class="badge p">قيد المراجعة</div>';
    return '<div class="row'+(r.req?" sent":"")+'">'+
      '<div class="rank'+(i<3?" top":"")+'">'+(i+1)+'</div>'+
      '<div class="info"><b>'+esc(r.name)+
        (r.monthly?'<span class="tag">شهري</span>':'')+'</b>'+
        '<span>'+esc(r.phone)+' · '+num(r.orders)+' طلب</span></div>'+
      '<div class="money"><b>'+num(r.debt)+'</b><span>د.ع</span></div>'+
      right+'</div>';
  }).join("");

  const rest=debtPool().slice(total);
  foot.innerHTML='متبقٍّ في الطابور: <b>'+num(rest.length)+'</b> مطعماً'+
    ' · إجمالي ديونهم <b>'+num(rest.reduce((s,x)=>s+x.debt,0))+'</b> د.ع';
}

    '<div class="bar"><i style="width:'+Math.round(d/total*100)+'%"></i></div>'+
    '<div class="sub-t">المبلغ المعروض هو الاشتراك <b>الكامل</b> المعلن. عدّله عند '+
    'التسجيل إن قبضتَ أقلّ — القيمة الفعلية في تقرير المدير الشهري.</div></div>'+
    (d===total
      ? '<div class="done"><b>اكتملت الدفعة '+SBATCH_NO+'</b>'+
        '<p>سُجّل استلام '+total+' اشتراكاً. تظهر الآن دفعة جديدة.</p>'+
        '<button onclick="nextBatch()">الدفعة التالية</button></div>'
      : '');

  list.innerHTML=
    '<div class="note">📅 الاشتراك <b>ليس ديناً في الدفتر</b> — عمولته صفر بالطلب، '+
    'ويُحاسَب شهرياً في تقرير المدير. فهذا القسم <b>سجلّ استلام</b>: لا يُصفّر شيئاً، '+
    'ويوثّق ما قبضتَه ليطابقه المدير بتقريره.</div>'+
    rows.map(r=>{
      let right;
      if(!r.rec) right='<button class="rq v" onclick="askSub(\''+ej(r.phone)+'\')">سجّل الاستلام</button>';
      else if(r.rec.status==="approved") right='<div class="badge a">مؤكَّد ✓</div>';
      else if(r.rec.status==="rejected") right='<div class="badge r">مرفوض</div>';
      else right='<div class="badge p">قيد المراجعة</div>';
      const shown=r.rec?(Number(r.rec.amount)||0):r.amount;
      return '<div class="row'+(r.rec?" sent":"")+'">'+
        '<div class="rank sub">📅</div>'+
        '<div class="info"><b>'+esc(r.name)+'</b>'+
          '<span>'+esc(r.phone)+' · '+num(r.orders)+' طلب</span></div>'+
        '<div class="money v"><b>'+num(shown)+'</b><span>د.ع</span></div>'+
        right+'</div>';
    }).join("");

  const rest=subPool().slice(total);
  foot.innerHTML='متبقٍّ لهذا الشهر: <b>'+num(rest.length)+'</b> مطعماً'+
    ' · إجمالي اشتراكاتهم <b>'+num(rest.reduce((s,x)=>s+x.amount,0))+'</b> د.ع';
}

/* ════════════════════ الحوارات ════════════════════ */
function openModal(html,onGo){
  const m=document.createElement("div");m.id="modal";
  m.innerHTML='<div class="mcard">'+html+
    '<div class="mrow"><button class="no" onclick="closeModal()">إلغاء</button>'+
    '<button class="go" id="mGo">تأكيد</button></div></div>';
  document.body.appendChild(m);
  m.addEventListener("click",e=>{if(e.target===m)closeModal();});
  document.getElementById("mGo").onclick=onGo;
}
window.closeModal=function(){const m=document.getElementById("modal");if(m)m.remove();};

window.askDebt=function(phone){
  const name=(CFG[phone]||{}).name||phone;
  const debt=Number((LEDGERS[phone]||{}).debt)||0;
  openModal(
    '<h3>طلب تصفير</h3>'+
    '<div class="mres">'+esc(name)+' — الدين <em>'+num(debt)+' د.ع</em><br>'+
      'يُرفع الطلب إلى المدير، وهو من يُصفّر الدفتر بعد قبوله.</div>'+
    '<label for="mNote">ملاحظة للمدير (اختيارية)</label>'+
    '<textarea id="mNote" placeholder="مثل: استُلم نقداً · أو على دفعتين"></textarea>',
    ()=>sendDebt(phone,name,debt));
  setTimeout(()=>{const t=document.getElementById("mNote");if(t)t.focus();},50);
};

async function sendDebt(phone,name,debt){
  const btn=document.getElementById("mGo");btn.disabled=true;btn.textContent="جارٍ الإرسال…";
  const note=(document.getElementById("mNote")||{}).value||"";
  try{
    /* الحقول الأربعة الأولى تشترطها قاعدة .validate — لا تحذف أياً منها.
       والدين لقطةٌ للعرض؛ قرار المدير يقوم على القيمة الحيّة لا على هذه. */
    await db.ref("clearing_requests/"+phone).set({
      phone:phone, by:EMP_PHONE, ts:new Date().toISOString(), status:"pending",
      name:String(name).slice(0,120), byName:String(EMP_NAME||"").slice(0,80),
      debt_at_request:debt,
      orders_at_request:Number((LEDGERS[phone]||{}).completed_orders)||0,
      note:String(note).slice(0,300)
    });
    closeModal(); toast("رُفع طلب تصفير "+name);
  }catch(e){ failModal(e,btn,"تأكيد"); }
}

window.askSub=function(phone){
  const name=(CFG[phone]||{}).name||phone;
  const amt=subAmount((CFG[phone]||{}).comm)||0;
  openModal(
    '<h3>تسجيل استلام اشتراك</h3>'+
    '<div class="mres">'+esc(name)+' — اشتراك '+esc(monthLabel(MONTH))+'<br>'+
      'لا يُصفَّر شيء في الدفتر. هذا توثيقٌ لما قبضتَه، يطابقه المدير بتقريره الشهري.</div>'+
    '<label for="mAmt">المبلغ المستلم (د.ع)</label>'+
    '<input type="number" id="mAmt" inputmode="numeric" min="0" value="'+amt+'">'+
    '<label for="mNote">ملاحظة (اختيارية)</label>'+
    '<textarea id="mNote" placeholder="مثل: نصف اشتراك — عمل نصف الشهر"></textarea>',
    ()=>sendSub(phone,name,amt));
  setTimeout(()=>{const t=document.getElementById("mAmt");if(t){t.focus();t.select();}},50);
};

async function sendSub(phone,name,declared){
  const btn=document.getElementById("mGo");
  const amt=Number((document.getElementById("mAmt")||{}).value);
  if(!(amt>=0)||isNaN(amt)){ toast("أدخل مبلغاً صحيحاً","e"); return; }
  btn.disabled=true;btn.textContent="جارٍ الحفظ…";
  const note=(document.getElementById("mNote")||{}).value||"";
  try{
    await db.ref("sub_collections/"+MONTH+"/"+phone).set({
      phone:phone, by:EMP_PHONE, ts:new Date().toISOString(), status:"pending",
      month:MONTH, amount:Math.round(amt), declared:declared,
      name:String(name).slice(0,120), byName:String(EMP_NAME||"").slice(0,80),
      note:String(note).slice(0,300)
    });
    closeModal(); toast("سُجّل استلام "+name);
  }catch(e){ failModal(e,btn,"تأكيد"); }
}

function failModal(e,btn,label){
  btn.disabled=false;btn.textContent=label;
  const msg=String((e&&e.message)||"");
  if(/permission|denied/i.test(msg))
    toast("مرفوض — العقدة غير منشورة في قواعد فايربيس","e");
  else
    toast("تعذّر الحفظ. تحقّق من الاتصال وأعد المحاولة.","e");
}
</script>
