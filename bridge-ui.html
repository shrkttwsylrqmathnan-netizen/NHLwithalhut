<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>نحلة — الطابعة</title>
<!-- 🖨️ [V34.25] نافذة الكاشير في «جسر نحلة للطابعة» — تُعرض داخل البرنامج (محرّك ويندوز المدمج IE11)
     من موقع نحلة، فيتحدّث شكلها مع الموقع كلوحة المطاعم؛ ونسخةٌ منها مدمجة في البرنامج لانقطاع الإنترنت.
     ES5 وحده، ولا متغيّرات CSS ولا gap (IE11). شكل البطاقات منقولٌ من Restaurant.html (live-order-card).
     البيانات من البرنامج نفسه: window.external.state() — الوصولات الجديدة وطلبات المطعم الجارية لحظةً بلحظة. -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; padding: 0; }
body { background: #f8fafc; font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; color: #1e293b; font-size: 14px; overflow-x: hidden; }
* { box-sizing: border-box; }
.hdr { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #fff; border-bottom: 1px solid #e2e8f0; }
.hdr .nm { font-weight: 900; font-size: 14px; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
.hdr .br { font-size: 11px; font-weight: 900; color: #3b82f6; letter-spacing: 1px; }
.chip { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 10px; background: #f1f5f9; color: #475569; margin-left: 6px; }
.chip.auto { background: #dcfce7; color: #166534; }
.chip.off { background: #fee2e2; color: #991b1b; }
.xbtn { border: none; background: #f1f5f9; color: #475569; width: 30px; height: 30px; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: 900; }
.sec { font-size: 12px; font-weight: 900; color: #64748b; margin: 12px 14px 6px; }
.wrap { padding: 0 10px 10px; }
.card { background: #fff; border-radius: 20px; margin-bottom: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
.rail { height: 4px; background: #f1f5f9; position: relative; overflow: hidden; }
.rail-fill { position: absolute; top: 0; bottom: 0; right: 0; background: #f97316; background: linear-gradient(90deg, #f97316, #10b981); border-radius: 0 4px 4px 0; }
.body { padding: 14px; }
.row { display: flex; justify-content: space-between; align-items: flex-start; }
.status { font-size: 15px; font-weight: 900; color: #0f172a; line-height: 1.35; }
.status.searching { color: #b45309; }
.status.done { color: #16a34a; }
.meta { text-align: left; }
.oid { font-size: 11px; color: #94a3b8; font-weight: 800; display: block; }
.otime { font-size: 11px; color: #94a3b8; font-weight: 600; }
.drv { display: flex; align-items: center; padding: 10px 12px; border-radius: 16px; background: #f0fdf4; border: 1px solid rgba(16,185,129,.18); margin-top: 10px; }
.drv.waiting { background: #f8fafc; border-color: rgba(15,23,42,.06); }
.av { width: 48px; height: 48px; border-radius: 50%; background: #fff; border: 2px solid rgba(16,185,129,.35); overflow: hidden; display: flex; align-items: center; justify-content: center; color: #10b981; font-size: 22px; margin-left: 10px; }
.av img { width: 100%; height: 100%; display: block; }
.av.waiting { border-style: dashed; border-color: #cbd5e1; color: #94a3b8; }
.dw { -ms-flex: 1; flex: 1; min-width: 0; }
.dn { font-weight: 900; color: #0f172a; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dr { font-size: 11px; font-weight: 700; color: #94a3b8; margin-top: 2px; }
.dph { background: #dcfce7; color: #16a34a; border-radius: 10px; padding: 4px 10px; font-weight: 800; font-size: 12px; direction: ltr; }
.area { font-weight: 700; font-size: 13px; color: #475569; margin-top: 8px; }
.area b { color: #f97316; }
.trk { position: relative; display: flex; justify-content: space-between; margin-top: 12px; }
.trk .ln { position: absolute; top: 8px; left: 12%; right: 12%; height: 2px; background: #e2e8f0; }
.trk .lf { position: absolute; top: 8px; right: 12%; height: 2px; background: #10b981; }
.st { position: relative; width: 25%; text-align: center; }
.dot { width: 18px; height: 18px; border-radius: 50%; background: #e2e8f0; margin: 0 auto; }
.st.active .dot { background: #10b981; }
.st.current .dot { background: #0f172a; box-shadow: 0 0 0 4px rgba(15,23,42,.1); }
.lbl { font-size: 10px; font-weight: 700; color: #94a3b8; margin-top: 4px; display: block; }
.st.active .lbl, .st.current .lbl { color: #0f172a; }
.acts { display: flex; align-items: center; border-top: 1px dashed #e2e8f0; padding-top: 10px; margin-top: 12px; }
.acts > * { margin-left: 8px; }
.btn { border: none; border-radius: 12px; cursor: pointer; font-family: inherit; font-weight: 800; font-size: 13px; padding: 10px 12px; }
.btn.ready { background: #fff7ed; color: #f97316; -ms-flex: 1; flex: 1; }
.pill { background: #fef9c3; color: #a16207; border-radius: 10px; padding: 8px 12px; font-size: 12px; font-weight: 800; -ms-flex: 1; flex: 1; text-align: center; }
.ibtn { width: 42px; height: 42px; border-radius: 14px; border: none; cursor: pointer; font-size: 17px; background: #f1f5f9; color: #475569; }
.ibtn.receipt { background: #e0f2fe; color: #3b82f6; }
.ibtn.danger { background: #fef2f2; color: #ef4444; }
.btn.send { background: #16a34a; color: #fff; -ms-flex: 1; flex: 1; font-size: 15px; padding: 12px; }
.btn.no { background: #f1f5f9; color: #475569; }
.tk { display: flex; }
.tk .th { width: 96px; height: 128px; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; background: #f8fafc; cursor: pointer; margin-left: 10px; }
.tk .th img { width: 100%; }
.tk .inf { -ms-flex: 1; flex: 1; min-width: 0; font-weight: 800; font-size: 13px; color: #334155; line-height: 1.8; }
.tk .msg { font-size: 12px; font-weight: 800; margin-top: 4px; }
.msg.warn { color: #b45309; } .msg.err { color: #dc2626; } .msg.info { color: #2563eb; }
.empty { text-align: center; color: #94a3b8; font-weight: 800; font-size: 13px; padding: 30px 10px; }
.ov { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,.85); display: none; text-align: center; padding: 10px; overflow: auto; }
.ov img { max-width: 100%; background: #fff; }
.ov .c { color: #fff; font-weight: 900; font-size: 14px; padding: 8px; cursor: pointer; }
/* [2.2] الشريط الصغير — الوضع العاديّ؛ النافذة الكاملة لا تُفتح إلا لقرارٍ أو بضغطة */
#mini { display: none; height: 56px; padding: 0 10px 0 6px; align-items: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 28px; cursor: pointer; overflow: hidden; }
body.mini #mini { display: flex; }
body.mini #full { display: none; }
body.mini { background: transparent; overflow: hidden; }
#mini .ic { width: 42px; height: 42px; border-radius: 50%; background: #eff6ff; color: #3b82f6; font-size: 20px; text-align: center; line-height: 42px; margin-left: 8px; }
#mini .ic.hot { background: #16a34a; color: #fff; }
#mini .tx { -ms-flex: 1; flex: 1; min-width: 0; }
#mini .t1 { font-weight: 900; font-size: 13px; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#mini .t2 { font-weight: 700; font-size: 11px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#mini .t2.ev { color: #16a34a; font-weight: 800; }
#mini .mx { border: none; background: transparent; color: #94a3b8; font-size: 16px; font-weight: 900; width: 26px; height: 26px; cursor: pointer; }
.hdr { cursor: move; }
.off { background: #fef2f2; color: #991b1b; font-weight: 800; font-size: 12px; padding: 6px 12px; text-align: center; }
</style>
</head>
<body>
<div id="mini" onmousedown="dragMaybe(event)" onclick="if(!window.__dragged) call('expand')">
  <div class="ic" id="mic">🛵</div>
  <div class="tx"><div class="t1" id="mt1">…</div><div class="t2" id="mt2"></div></div>
  <button class="mx" title="إخفاء حتى يأتي جديد" onclick="event.cancelBubble=true; if(event.stopPropagation) event.stopPropagation(); hideWin(); return false;">×</button>
</div>
<div id="full">
<div class="hdr" onmousedown="dragMaybe(event)">
  <div><div class="nm" id="nm">جسر نحلة للطابعة</div><div class="br">نحلة <span class="chip" id="mode">…</span></div></div>
  <div><button class="xbtn" onclick="call('collapse')" title="تصغير">−</button> <button class="xbtn" onclick="hideWin()" title="إخفاء حتى يأتي جديد">×</button></div>
</div>
<div id="net" class="off" style="display:none">⚠️ لا اتصال بنحلة — تتحدّث الحالة حين يعود الإنترنت</div>
<div id="root"></div>
</div>
<div class="ov" id="ov" onclick="this.style.display='none'"><div class="c">✕ إغلاق</div><img id="ovimg" alt=""></div>
<script>
var X = window.external, last = "", VER_PAGE = "2.3";
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function hm(ms) { var d = new Date(ms); var h = d.getHours(), m = d.getMinutes(); return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m; }
function call(fn, a) { try { return a === undefined ? X[fn]() : X[fn](a); } catch (e) { return ""; } }
function hideWin() { call("hide"); }
/* السحب: الضغط على الشريط أو رأس النافذة (لا الأزرار) يحرّك النافذة — والبرنامج يتذكّر مكانها */
function dragMaybe(e) { var t = e.target || e.srcElement; if (t && (t.tagName === "BUTTON")) return; window.__dragged = false; var x0 = e.screenX, y0 = e.screenY;
  document.onmousemove = function (m) { m = m || window.event; if (Math.abs(m.screenX - x0) + Math.abs(m.screenY - y0) > 4) { window.__dragged = true; document.onmousemove = null; call("drag"); } };
  document.onmouseup = function () { document.onmousemove = null; setTimeout(function () { window.__dragged = false; }, 50); }; }
function miniView(d) {
  var nt = d.tickets ? d.tickets.length : 0, no = d.orders ? d.orders.length : 0, act = 0, i;
  for (i = 0; i < no; i++) if (!d.orders[i].done) act++;
  var ic = document.getElementById("mic"), t1 = document.getElementById("mt1"), t2 = document.getElementById("mt2");
  ic.className = "ic" + (nt ? " hot" : ""); ic.innerHTML = nt ? "🧾" : "🛵";
  t1.innerHTML = nt ? (nt === 1 ? "🔔 وصل توصيل جديد" : "🔔 " + nt + " وصولات توصيل") : (act ? (act === 1 ? "طلبٌ جارٍ واحد" : act + " طلبات جارية") : "سُلّمت الطلبات ✅");
  if (!nt && d.event && d.event.text) { t2.className = "t2 ev"; t2.innerHTML = esc(d.event.text); }
  else { t2.className = "t2"; t2.innerHTML = nt ? "اضغط للإرسال إلى نحلة" : (act ? "اضغط لمتابعة الكباتن" : ""); }
}
function showImg(src) { if (!src) return; document.getElementById("ovimg").src = src; document.getElementById("ov").style.display = "block"; }
function tkImg(cid) { showImg(call("image", cid)); }
function send(cid, el) { el.disabled = true; el.innerHTML = "✓ استُلم — جارٍ الإرسال"; call("send", cid); }
function dismiss(cid) { call("dismiss", cid); }
function ready(id, el) { el.disabled = true; el.innerHTML = "…"; call("ready", id); }
function cancelOrder(id) { if (confirm("تأكيد إلغاء الطلب؟")) call("cancel", id); }

var SKIP = { pending_driver: 1, manual_pending: 1, system_routing: 1 };
function orderCard(o) {
  var hasDriver = o.driverPhone && !SKIP[o.driverPhone];
  var st = o.status, step = 1, fill = 0, line, cls = "";
  var offered = hasDriver && (st === "pending_driver" || st === "manual_pending");
  if (o.done) { step = 5; fill = 100; line = "سُلّم الطلب ✅"; cls = "done"; }
  else if (offered) { fill = 10; line = "عُرض على كابتن — بانتظار قبوله"; }
  else if (hasDriver) {
    if (st === "picked_up" || st === "في الطريق") { step = 4; fill = 100; }
    else if (st === "arrived_at_res") { step = 3; fill = 66; }
    else { step = 2; fill = 33; }
    line = ["", "", "الكابتن متوجّه إليك", "الكابتن عند بابك", "الطلب في طريقه للزبون"][step];
  } else { line = "نبحث عن كابتن قريب"; cls = "searching"; }
  var h = '<div class="card"><div class="rail"><div class="rail-fill" style="width:' + fill + '%"></div></div><div class="body">';
  h += '<div class="row"><div class="status ' + cls + '">' + esc(line) + '</div><div class="meta"><span class="oid">#' + esc(o.id) + '</span><span class="otime">🕐 ' + esc(o.time) + '</span></div></div>';
  h += '<div class="drv' + (hasDriver ? '' : ' waiting') + '"><div class="av' + (hasDriver ? '' : ' waiting') + '">' +
       (hasDriver && o.driverPhoto ? '<img src="' + esc(o.driverPhoto) + '" alt="">' : (hasDriver ? '🛵' : '📡')) + '</div>' +
       '<div class="dw"><div class="dn">' + esc(hasDriver ? (o.driverName || "كابتن التوصيل") : "يبحث عن كابتن...") + '</div><div class="dr">' + (hasDriver ? "كابتن التوصيل" : "جارٍ الإسناد…") + '</div></div>' +
       (hasDriver ? '<span class="dph">0' + esc(o.driverPhone) + '</span>' : '') + '</div>';
  h += '<div class="area"><b>📍</b> ' + esc(o.area || "غير محددة") + '</div>';
  if (!o.done) {
    h += '<div class="trk"><div class="ln"></div><div class="lf" style="width:' + Math.round(fill * 0.76) + '%"></div>';
    var L = ["بانتظار", "متوجه", "بالمطعم", "بالطريق"];
    for (var i = 1; i <= 4; i++) h += '<div class="st ' + (step >= i ? (step === i ? "current" : "active") : "") + '"><div class="dot"></div><span class="lbl">' + L[i - 1] + '</span></div>';
    h += '</div>';
    var showReady = hasDriver && (st === "accepted" || st === "heading" || st === "arrived_at_res");
    var cancelable = !(st === "picked_up" || st === "في الطريق");
    var a = "";
    if (showReady) a += o.ready ? '<span class="pill">✔ جاهز للاستلام</span>' : '<button class="btn ready" onclick="ready(\'' + esc(o.id) + '\',this)">📦 إبلاغ الكابتن بالجهوزية</button>';
    if (o.photoUrl) a += '<button class="ibtn receipt" title="عرض الوصل" onclick="showImg(\'' + esc(o.photoUrl) + '\')">🧾</button>';
    if (cancelable) a += '<button class="ibtn danger" title="إلغاء الطلب" onclick="cancelOrder(\'' + esc(o.id) + '\')">✕</button>';
    if (a) h += '<div class="acts">' + a + '</div>';
  }
  return h + '</div></div>';
}
function ticketCard(t) {
  var h = '<div class="card"><div class="rail"><div class="rail-fill" style="width:' + (t.state === "queued" ? 50 : 0) + '%"></div></div><div class="body"><div class="tk">';
  h += '<div class="th" onclick="tkImg(\'' + esc(t.cid) + '\')">' + (t.thumb ? '<img src="' + t.thumb + '" alt="">' : '') + '</div><div class="inf">';
  h += '<div class="status" style="font-size:14px">' + (t.state === "queued" ? "⏳ جارٍ الإرسال إلى نحلة…" : t.state === "error" ? "⛔ تعذّر" : "🧾 وصل توصيل جديد") + '</div>';
  h += '<div>🕐 طُبع ' + esc(t.time) + '</div>';
  if (t.phone) h += '<div>📞 <span style="direction:ltr">' + esc(t.phone) + '</span></div>';
  if (t.area) h += '<div>📍 ' + esc(t.area) + '</div>';
  if (t.price) h += '<div>💵 ' + esc(t.price) + '</div>';
  if (t.msg) h += '<div class="msg ' + (t.state === "error" ? "err" : "warn") + '">' + esc(t.msg) + '</div>';
  h += '</div></div>';
  if (t.state === "card" || t.state === "error")
    h += '<div class="acts"><button class="btn send" ' + (t.canSend ? '' : 'disabled') + ' onclick="send(\'' + esc(t.cid) + '\',this)">إرسال إلى نحلة</button><button class="btn no" onclick="dismiss(\'' + esc(t.cid) + '\')">ليس توصيلاً</button></div>';
  return h + '</div></div>';
}
function render() {
  var s = call("state"); if (!s || s === last) return; last = s;
  var d; try { d = JSON.parse(s); } catch (e) { return; }
  document.body.className = d.view === "mini" ? "mini" : "";
  if (d.view === "mini") { miniView(d); return; }
  document.getElementById("nm").innerHTML = esc(d.name || "جسر نحلة للطابعة");
  var m = document.getElementById("mode");
  m.className = "chip " + (d.mode === "auto" ? "auto" : d.mode === "off" ? "off" : "");
  m.innerHTML = d.mode === "auto" ? "تلقائي" : d.mode === "off" ? "متوقف" : "زرّ يدويّ";
  document.getElementById("net").style.display = d.online === false ? "block" : "none";
  var h = "", i;
  if (d.tickets && d.tickets.length) { h += '<div class="sec">🧾 وصولات جديدة من الطابعة</div><div class="wrap">'; for (i = 0; i < d.tickets.length; i++) h += ticketCard(d.tickets[i]); h += '</div>'; }
  if (d.orders && d.orders.length) { h += '<div class="sec">🛵 طلباتك الجارية</div><div class="wrap">'; for (i = 0; i < d.orders.length; i++) h += orderCard(d.orders[i]); h += '</div>'; }
  if (!h) h = '<div class="empty">لا توجد طلبات الآن</div>';
  document.getElementById("root").innerHTML = h;
  call("resize", document.body.scrollHeight);
}
/* [2.3] كلّ حركة فأرة أو ضغطة أو تمرير = الموظّف يتفاعل ⇒ لا تُصغَّر النافذة (مرّةً كلّ ثانيتين على الأكثر) */
var lastTouch = 0;
function touch() { var n = new Date().getTime(); if (n - lastTouch > 2000) { lastTouch = n; call("touch"); } }
var TEV = ["mousemove", "mousedown", "wheel", "mousewheel", "keydown", "touchstart"];
for (var ti = 0; ti < TEV.length; ti++) { if (document.addEventListener) document.addEventListener(TEV[ti], touch, true); }
call("ready_ui", VER_PAGE);
render(); setInterval(render, 1000);
</script>
</body>
</html>
